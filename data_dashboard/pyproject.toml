[project]
name = "data-dashboard"
version = "0.1.0"
description = "Data analytics for ticketing systems (SupportHub)"
authors = [
    {name = "Joe Muldowney"}
]
requires-python = "^3.12"
dependencies = [
    "dash (>=4.2.0,<5.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "dash-bootstrap-components (>=2.0.4,<3.0.0)",
    "pymysql (>=1.2.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
